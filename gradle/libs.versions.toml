[versions]
# Core
agp                  = "8.5.2"
kotlin               = "2.0.21"
ksp                  = "2.0.21-1.0.28"
coreKtx              = "1.13.1"

# Compose
composeBom           = "2024.09.03"
activityCompose      = "1.9.2"
navigationCompose    = "2.8.3"

# Lifecycle / ViewModel
lifecycle            = "2.8.6"

# Hilt
hilt                 = "2.52"
hiltNavigation       = "1.2.0"

# Room
room                 = "2.6.1"

# Network
okhttp               = "4.12.0"
retrofit             = "2.11.0"
jsoup                = "1.18.1"

# Image
coil                 = "2.7.0"

# DataStore
datastore            = "1.1.1"

# WorkManager
work                 = "2.9.1"

# Coroutines
coroutines           = "1.8.1"

playServicesAuth    = "21.2.0"
credentialsManager  = "1.3.0"
googleId            = "1.1.1"
gson                = "2.10.1"

# Testing
mockk                = "1.13.12"
turbine              = "1.1.0"
archCore             = "2.2.0"

[libraries]
# AndroidX
androidx-core-ktx               = { group = "androidx.core",               name = "core-ktx",                          version.ref = "coreKtx" }
androidx-activity-compose       = { group = "androidx.activity",            name = "activity-compose",                  version.ref = "activityCompose" }

# Compose BOM
compose-bom                     = { group = "androidx.compose",             name = "compose-bom",                       version.ref = "composeBom" }
compose-ui                      = { group = "androidx.compose.ui",          name = "ui" }
compose-ui-graphics             = { group = "androidx.compose.ui",          name = "ui-graphics" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",          name = "ui-tooling-preview" }
compose-material3               = { group = "androidx.compose.material3",   name = "material3" }
compose-material-icons          = { group = "androidx.compose.material",    name = "material-icons-extended" }
compose-ui-tooling              = { group = "androidx.compose.ui",          name = "ui-tooling" }

# Navigation
navigation-compose              = { group = "androidx.navigation",          name = "navigation-compose",                version.ref = "navigationCompose" }

# Lifecycle
lifecycle-runtime-ktx           = { group = "androidx.lifecycle",           name = "lifecycle-runtime-ktx",             version.ref = "lifecycle" }
lifecycle-viewmodel-compose     = { group = "androidx.lifecycle",           name = "lifecycle-viewmodel-compose",       version.ref = "lifecycle" }

# Hilt
hilt-android                    = { group = "com.google.dagger",            name = "hilt-android",                      version.ref = "hilt" }
hilt-compiler                   = { group = "com.google.dagger",            name = "hilt-compiler",                     version.ref = "hilt" }
hilt-navigation-compose         = { group = "androidx.hilt",                name = "hilt-navigation-compose",           version.ref = "hiltNavigation" }
hilt-work                       = { group = "androidx.hilt",                name = "hilt-work",                         version.ref = "hiltNavigation" }
hilt-work-compiler              = { group = "androidx.hilt",                name = "hilt-compiler",                     version.ref = "hiltNavigation" }

# Room
room-runtime                    = { group = "androidx.room",                name = "room-runtime",                      version.ref = "room" }
room-ktx                        = { group = "androidx.room",                name = "room-ktx",                          version.ref = "room" }
room-compiler                   = { group = "androidx.room",                name = "room-compiler",                     version.ref = "room" }

# Network
okhttp-bom                      = { group = "com.squareup.okhttp3",         name = "okhttp-bom",                        version.ref = "okhttp" }
okhttp                          = { group = "com.squareup.okhttp3",         name = "okhttp" }
okhttp-logging                  = { group = "com.squareup.okhttp3",         name = "logging-interceptor" }
mockwebserver                   = { group = "com.squareup.okhttp3",         name = "mockwebserver",                     version.ref = "okhttp" }
retrofit                        = { group = "com.squareup.retrofit2",       name = "retrofit",                          version.ref = "retrofit" }
retrofit-converter-gson         = { group = "com.squareup.retrofit2",       name = "converter-gson",                    version.ref = "retrofit" }
jsoup                           = { group = "org.jsoup",                    name = "jsoup",                             version.ref = "jsoup" }

# Image
coil-compose                    = { group = "io.coil-kt",                   name = "coil-compose",                      version.ref = "coil" }

# DataStore
datastore-preferences           = { group = "androidx.datastore",           name = "datastore-preferences",             version.ref = "datastore" }

# WorkManager
work-runtime-ktx                = { group = "androidx.work",                name = "work-runtime-ktx",                  version.ref = "work" }

# Coroutines
coroutines-android              = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-android",        version.ref = "coroutines" }

# Testing
junit                           = { group = "junit",                        name = "junit",                             version = "4.13.2" }
androidx-junit                  = { group = "androidx.test.ext",            name = "junit",                             version = "1.2.1" }
espresso-core                   = { group = "androidx.test.espresso",       name = "espresso-core",                     version = "3.6.1" }
mockk                           = { group = "io.mockk",                     name = "mockk",                             version.ref = "mockk" }
mockk-android                   = { group = "io.mockk",                     name = "mockk-android",                     version.ref = "mockk" }
coroutines-test                 = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-test",           version.ref = "coroutines" }
turbine                         = { group = "app.cash.turbine",             name = "turbine",                           version.ref = "turbine" }
arch-core-testing               = { group = "androidx.arch.core",           name = "core-testing",                      version.ref = "archCore" }
room-testing                    = { group = "androidx.room",                name = "room-testing",                      version.ref = "room" }

# Google Drive Backup
play-services-auth           = { group = "com.google.android.gms",                              name = "play-services-auth",              version.ref = "playServicesAuth" }
credentials                  = { group = "androidx.credentials",                                 name = "credentials",                     version.ref = "credentialsManager" }
credentials-play-services    = { group = "androidx.credentials",                                 name = "credentials-play-services-auth",  version.ref = "credentialsManager" }
google-id                    = { group = "com.google.android.libraries.identity.googleid",       name = "googleid",                        version.ref = "googleId" }
gson                         = { group = "com.google.code.gson",                                 name = "gson",                            version.ref = "gson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
